[project]
name = "vmzero"
version = "0.1.0"
description = "Run M5Stack apps on the Cardputer Zero - natively where it can, emulated where it must."
authors = [{ name = "Runaque" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pygame>=2.5"]

[project.urls]
Homepage = "https://github.com/Runaque/VMzero"

[project.scripts]
vmzero = "vmzero.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vmzero*"]
